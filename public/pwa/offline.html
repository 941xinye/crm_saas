<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线 - CRM</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; background: #f9fafb; color: #111827;
        }
        .box { text-align: center; padding: 2rem; }
        h1 { font-size: 1.25rem; margin-bottom: .5rem; }
        p { color: #6b7280; font-size: .875rem; margin: 0 0 1.25rem; }
        button {
            background: #4f46e5; color: #fff; border: 0; border-radius: .5rem;
            padding: .5rem 1.25rem; font-size: .875rem; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>网络连接不可用</h1>
        <p>您当前处于离线状态，请检查网络后重试。</p>
        <button onclick="location.reload()">重新加载</button>
    </div>
</body>
</html>
